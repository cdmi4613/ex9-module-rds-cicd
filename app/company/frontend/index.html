<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Frontend</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 40px;
        }

        header h1 {
            font-size: 24px;
        }

        .container {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .card {
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 50px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: #e0f2fe;
            color: #0369a1;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 36px;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 14px 24px;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.2s;
        }

        .button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <header>
        <h1>Megazone Bootcamp</h1>
    </header>

    <div class="container">
        <div class="card">

            <div class="badge">
                Nginx Frontend
            </div>

            <h2>Company Service</h2>

            <a class="button" href="/api/company">
                Backend 페이지 확인
            </a>

        </div>
    </div>

</body>

</html>
